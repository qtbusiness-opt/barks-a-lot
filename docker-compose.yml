services:
  app:
    build:
      context: .
      target: dev
      args:
        DATABASE_URL: "file:/app/data/dev.db"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=${JWT_SECRET:-dev-secret-not-for-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@barks-a-lot.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - WATCHPACK_POLLING=true
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./prisma:/app/prisma
      - ./scripts:/app/scripts
      - dev-data:/app/data
    restart: unless-stopped

volumes:
  dev-data:

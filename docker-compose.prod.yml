services:
  app:
    build:
      context: .
      args:
        NODE_ENV: production
        DATABASE_URL: "file:/app/data/prod.db"
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_SQUARE_APP_ID: ${NEXT_PUBLIC_SQUARE_APP_ID:-}
        NEXT_PUBLIC_SQUARE_LOCATION_ID: ${NEXT_PUBLIC_SQUARE_LOCATION_ID:-}
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-long-random-secret}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@barks-a-lot.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-this-admin-password-1}
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - NEXT_PUBLIC_SQUARE_APP_ID=${NEXT_PUBLIC_SQUARE_APP_ID:-}
      - NEXT_PUBLIC_SQUARE_LOCATION_ID=${NEXT_PUBLIC_SQUARE_LOCATION_ID:-}
      - SQUARE_ACCESS_TOKEN=${SQUARE_ACCESS_TOKEN:-}
      - SQUARE_ENV=${SQUARE_ENV:-sandbox}
      - TZ=${TZ:-America/Boise}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - APP_URL=${APP_URL:-}
    volumes:
      - prod-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  prod-data:

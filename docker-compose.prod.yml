services:
  app:
    build:
      context: .
      args:
        NODE_ENV: production
        DATABASE_URL: "file:/app/data/prod.db"
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-long-random-secret}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@barks-a-lot.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-this-admin-password}
    volumes:
      - prod-data:/app/data
    restart: unless-stopped

volumes:
  prod-data:

services:
  app:
    build:
      context: .
      args:
        NODE_ENV: production
        DATABASE_URL: "file:/app/data/qual.db"
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/qual.db
      - JWT_SECRET=${JWT_SECRET:-change-this-qual-secret}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@barks-a-lot.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-this-admin-password}
    volumes:
      - qual-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  qual-data:

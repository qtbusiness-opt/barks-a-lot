services:
  app:
    build:
      context: .
      args:
        NODE_ENV: development
        DATABASE_URL: "file:/app/data/dev.db"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=${JWT_SECRET:-dev-secret-not-for-production}
    volumes:
      - dev-data:/app/data
    restart: unless-stopped

volumes:
  dev-data:

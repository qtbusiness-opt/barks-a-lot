services:
  app:
    build:
      context: .
      target: dev
      args:
        DATABASE_URL: "file:/app/data/dev.db"
    command: ["sh", "-c", "node node_modules/prisma/build/index.js migrate deploy && node scripts/start-dev.js"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=${JWT_SECRET:-dev-secret-not-for-production}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - dev-data:/app/data
    restart: unless-stopped

volumes:
  dev-data:
